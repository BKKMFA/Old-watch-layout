<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic Watch Layout</title>
<style>
  :root { --bg:#fff; --fg:#0f0f0f; --muted:#606060; --line:#e5e5e5; --accent:#cc0000; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181818; --fg:#f1f1f1; --muted:#aaa; --line:#303030; --accent:#ff4e45; }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.4 Roboto, "Segoe UI", Arial, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 2px; display:flex; align-items:center; gap:8px; }
  .logo { width:22px; height:16px; background:var(--accent); border-radius:4px; position:relative; }
  .logo::after { content:""; position:absolute; left:8px; top:4px; border-left:7px solid #fff;
                 border-top:4px solid transparent; border-bottom:4px solid transparent; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  label.row { display:flex; justify-content:space-between; align-items:center; gap:12px;
              padding:9px 0; border-top:1px solid var(--line); cursor:pointer; }
  .t small { display:block; color:var(--muted); font-size:11.5px; }
  input[type=checkbox] { appearance:none; width:36px; height:20px; border-radius:10px; flex:none;
    background:#999; position:relative; cursor:pointer; transition:background .15s; }
  input[type=checkbox]::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
    border-radius:50%; background:#fff; transition:transform .15s; }
  input[type=checkbox]:checked { background:var(--accent); }
  input[type=checkbox]:checked::after { transform:translateX(16px); }
</style>
</head>
<body>
  <h1><span class="logo"></span>Classic Watch Layout</h1>
  <p class="sub">After changing an option, reload the YouTube tab.</p>

  <label class="row"><span class="t">Classic watch page<small>Comments under video, recommendations on the right</small></span><input type="checkbox" id="classicWatch"></label>
  <label class="row"><span class="t">Always theater mode<small>Wide player on every video</small></span><input type="checkbox" id="autoTheater"></label>
  <label class="row"><span class="t">Hide Premium upsells</span><input type="checkbox" id="hidePremium"></label>

  <script src="popup.js"></script>
</body>
</html>
